name: Blueprint & API docs

# Builds the leanblueprint web + PDF and the doc-gen4 API documentation, then
# deploys them to GitHub Pages:
#   * blueprint web  ->  https://batchatco.github.io/<repo>/blueprint/
#   * API docs       ->  https://batchatco.github.io/<repo>/docs/   (matches \dochome)
#
# doc-gen4 is set up by docgen-action inside an ephemeral ./docbuild folder, so this
# repository's own lakefile.toml / lake-manifest.json are never touched.
#
# Note: GitHub Pages publishes only once the repository is public (free plan), so the
# deploy step is effectively a no-op until the go-public flip.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Free disk space (Mathlib build + texlive-full together overflow the runner)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0
        with:
          build-args: "--log-level=warning"
          lint: false
          test: false

      # docgen-action runs `lake exe checkdecls` unconditionally when blueprint:true.
      # checkdecls comes transitively via flt-regular, so Mathlib-only repos (e.g.
      # flt-stickelberger) lack it. Provide it here in the CI checkout ONLY — this never
      # touches the committed lakefile.toml / lake-manifest.json. Idempotent: no-op where
      # checkdecls is already present. Pinned to the rev the other repos already resolve.
      - name: Provide checkdecls if missing (CI-only, not committed)
        run: |
          if ! grep -q '"checkdecls"' lake-manifest.json; then
            printf '\n[[require]]\nname = "checkdecls"\ngit = "https://github.com/PatrickMassot/checkdecls.git"\nrev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"\n' >> lakefile.toml
            ~/.elan/bin/lake update checkdecls
          fi

      - name: Blueprint + API docs + deploy to Pages
        uses: leanprover-community/docgen-action@10db47458f91456d87804787d3dfcd914b9a19e3 # main, pinned 2026-08
        with:
          blueprint: true
          api-docs: true
          build-page: false
